[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libcairo2",
  "libgdk-pixbuf2.0-0",
  "libffi-dev",
  "shared-mime-info",
  "fonts-dejavu",
  "fonts-dejavu-extra",
  "fonts-liberation",
]

[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:${PORT:-8080} --workers 2 --timeout 90"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
